name: Notebook cross-browser readiness
on:
  workflow_dispatch:
  push:
    paths:
      - 'field-notebook-next-preview.html'
      - 'tests/notebook.spec.cjs'
      - '.github/workflows/notebook-cross-browser.yml'
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProfessorTemple/eng112-research-connections-library
          path: eng112-research-connections-library
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve experimental notebook
        run: |
          python3 -m http.server 8765 > /tmp/notebook-server.log 2>&1 &
          curl --retry 5 --retry-connrefused http://localhost:8765/field-notebook-next-preview.html -o /dev/null
      - name: Core journey, recovery, exports and independent writing
        run: >
          npx playwright test tests/notebook.spec.cjs
          --browser=${{ matrix.browser }} --reporter=list,html
          --grep 'complete student-led inquiry|interrupted thesis work|intellectual trail exports and restores|failed backup storage|legacy backup replaces|keyboard access and quiet status|returning student may pick up a thread|carried thinking invitation|full writing session'
        env:
          NOTEBOOK_URL: http://localhost:8765/field-notebook-next-preview.html
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-readiness-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
