name: Experimental semantic evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/semantic-evaluation.yml'
      - 'tests/semantic-model-evaluation.mjs'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @huggingface/transformers@3.7.2 --onnxruntime-node-install-cuda=skip
      - run: set -o pipefail; node tests/semantic-model-evaluation.mjs | tee semantic-results.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-evaluation-results
          path: semantic-results.txt
