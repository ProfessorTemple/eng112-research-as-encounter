name: Experimental semantic evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/semantic-evaluation.yml'
      - 'tests/semantic-model-evaluation.mjs'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        model: ['Xenova/all-MiniLM-L6-v2', 'Xenova/e5-small-v2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @huggingface/transformers@3.7.2 --onnxruntime-node-install-cuda=skip
      - run: set -o pipefail; node tests/semantic-model-evaluation.mjs | tee semantic-results.txt
        shell: bash
        env:
          EMBEDDING_MODEL: ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-evaluation-results-${{ strategy.job-index }}
          path: semantic-results.txt
