name: Guided Journey browser checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'guided-journey-example.html'
      - 'tests/guided-journey.spec.cjs'
      - '.github/workflows/guided-journey.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve guided notebook
        run: |
          python3 -m http.server 8765 > /tmp/guided-server.log 2>&1 &
          curl --retry 5 --retry-connrefused http://127.0.0.1:8765/guided-journey-example.html -o /dev/null
      - name: Run browser journey tests
        run: npx playwright test tests/guided-journey.spec.cjs --browser=${{ matrix.browser }} --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-journey-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
