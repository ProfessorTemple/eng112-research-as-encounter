name: Notebook accessibility review (report only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'field-notebook-next-preview.html'
      - 'tests/notebook-accessibility-audit.cjs'
      - '.github/workflows/notebook-accessibility.yml'
permissions:
  contents: read
jobs:
  synthetic-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProfessorTemple/eng112-research-connections-library
          path: eng112-research-connections-library
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test axe-core
      - run: npx playwright install --with-deps chromium
      - name: Serve checked-out experimental notebook
        run: |
          python3 -m http.server 8765 > /tmp/notebook-server.log 2>&1 &
          curl --retry 5 --retry-connrefused http://localhost:8765/field-notebook-next-preview.html -o /dev/null
      - run: node tests/notebook-accessibility-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-accessibility-report
          path: notebook-accessibility-report.json
