<script>
'use strict';
const KEY='eng112-guided-journey-example-v1', SAMPLE="I remember getting caught in a traffic jam on the way to a holiday visit to my parents. I am always late, and it looked like I'd be late again. I didn't want to call and let them know to go ahead with the holiday dinner without me. I was waiting for a holiday miracle to happen.";
const REFERENCE_VIEW=new URLSearchParams(location.search).get('view')==='journal';
const blank=()=>({step:0,encounter:'',words:[],question:'',search:'',history:[],library:'copy',outcome:'',keywords:[],title:'',author:'',passage:'',location:'',reflection:'',pdfName:'',year:'',publication:'',doi:'',pdfKeywords:[],journalStage:'details',notes:[],activeNoteId:'',nextNoteId:1,nextSearch:'',notesReturn:6,articleReturnId:'',pdfImportStatus:'',pdfId:'',connectionLeft:'',connectionRight:'',connectionKind:'',connectionReflection:'',connectionComplete:false,connections:[],storyOne:'',storyTwo:'',storyThree:'',workingThesis:'',thesisSaved:false,thesisStep:0,evidencePlan:'',assumptionPlan:'',alternativePlan:'',inquiryReviewed:false,initialThesis:'',strengthenedThesis:'',evidenceReadiness:'',writingEvidenceNote:'',researchReturn:0,essayTitle:'',essayDraft:'',reconsideredThesis:'',thesisReflection:'',writingComplete:false,strands:[],sourceOrigin:'',braidSections:[],braidActive:'',draftBraidId:'',revisionStarted:false,revisionOriginal:'',revisionPasses:{},revisionChecks:{},revisionFinished:false,revisionThesisReturn:false,paperName:'',paperCourse:'',paperDate:'',paperAbstract:'',paperKeywords:'',paperReferences:'',paperDisclosure:'',figures:[],essayReview:{},courseSection:'',firstEncounter:'',firstEncounterRecovered:false,criticalLens:'',lensNeedsReview:false,inquiryRevised:false,reciprocityReflection:'',agencyDecisions:[],quietRevision:false,independentRevision:false,noteEditReturn:0,bibInitialized:false,bibReturn:9,bibPhase:0,bibActive:'',bibEntries:[],bibCarry:[],bibLens:'',bibThesis:'',bibOverview:'',bibKeywords:'',bibState:'',bibQuestion:'',bibDate:'',bibDisclosure:''});
let state=blank(),storageOK=true;try{const saved=localStorage.getItem(KEY);if(saved)state={...blank(),...JSON.parse(saved)};}catch(e){storageOK=false;}
const app=document.getElementById('app');
const el=(tag,txt='',cls='')=>{const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n;};
function save(){if(REFERENCE_VIEW)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}const n=document.getElementById('save-state');const message=storageOK?'Saved on this device':'Backup recommended';if(n&&n.textContent!==message)n.textContent=message;}

const BACKUP_MAX=200*1024*1024,BACKUP_TEXT_MAX=10*1024*1024;
function notebookSnapshot(st){return JSON.parse(JSON.stringify({...st,prototype:'guided-journey-v1'}));}
function validateNotebook(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.prototype!=='guided-journey-v1')throw Error('Choose a backup from this Guided Journey.');
 const next=blank();
 for(const [k,initial] of Object.entries(next)){
  if(!Object.prototype.hasOwnProperty.call(raw,k))continue;
  const v=raw[k];
  if(Array.isArray(initial)?!Array.isArray(v)||v.length>1000:initial&&typeof initial==='object'?(!v||typeof v!=='object'||Array.isArray(v)):typeof v!==typeof initial)throw Error('Invalid notebook field: '+k);
  next[k]=v;
 }
 if(!Number.isInteger(next.step)||next.step<0||next.step>34||!['details','passage','saved'].includes(next.journalStage))throw Error('Invalid notebook stage.');
 for(const k of ['words','history','keywords','pdfKeywords'])if(next[k].some(x=>typeof x!=='string'))throw Error('Invalid vocabulary list.');
 for(const k of ['notes','connections','strands','braidSections','figures','agencyDecisions'])if(next[k].some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw Error('Invalid saved record: '+k);
 for(const n of next.notes)if(typeof n.id!=='string'||!n.id||['title','author','year','publication','doi','pdfName','pdfId','location','passage','reflection','sourceOrigin'].some(k=>n[k]!=null&&typeof n[k]!=='string')||n.pdfKeywords!=null&&(!Array.isArray(n.pdfKeywords)||n.pdfKeywords.some(x=>typeof x!=='string')))throw Error('Invalid reading note.');
 for(const n of next.strands)if(typeof n.id!=='string'||!Object.prototype.hasOwnProperty.call(strandTypes(),n.type)||typeof n.title!=='string'||typeof n.passage!=='string')throw Error('Invalid saved material.');
 if(next.bibEntries.length>5||next.bibCarry.some(x=>typeof x!=='string')||next.bibEntries.some(x=>!x||typeof x.id!=='string'||['reference','annotation','role','link'].some(k=>typeof x[k]!=='string')||typeof x.verified!=='boolean')||new Set(next.bibEntries.map(x=>x.id)).size!==next.bibEntries.length)throw Error('Invalid bibliography records.');
 for(const n of next.braidSections)if(typeof n.id!=='string'||!Array.isArray(n.keys)||n.keys.some(x=>typeof x!=='string'))throw Error('Invalid braiding section.');
 for(const f of next.figures)if(typeof f.id!=='string'||![1,2,3].includes(f.number)||!['png','jpg'].includes(f.ext)||!Number.isInteger(f.width)||!Number.isInteger(f.height)||f.width<=0||f.height<=0||f.width*f.height>40000000)throw Error('Invalid figure metadata.');
 if(new Set(next.figures.map(f=>f.number)).size!==next.figures.length)throw Error('Duplicate figure number.');
 return next;
}
function backupAttachments(st){
 const map=new Map();
 const add=(id,kind,name)=>{if(!id)return;if(typeof id!=='string'||id.length>200)throw Error('Invalid attachment identifier.');if(map.has(id)&&map.get(id).kind!==kind)throw Error('Conflicting attachment types.');if(!map.has(id))map.set(id,{id,kind,name:String(name||'').slice(0,240)});};
 add(st.pdfId,'pdf',st.pdfName);for(const n of st.notes||[])add(n.pdfId,'pdf',n.pdfName);for(const f of st.figures||[])add(f.id,f.ext,f.name);
 if(map.size>100)throw Error('More than 100 attachments. Save a text backup and keep the original files separately.');
 return [...map.values()];
}
function attachmentValid(kind,b){
 if(!(b instanceof Uint8Array)||!b.length)return false;
 if(kind==='pdf')return b.length<=20*1024*1024&&String.fromCharCode(...b.subarray(0,5))==='%PDF-';
 if(b.length>8*1024*1024)return false;
 return kind==='png'?b.length>=8&&[137,80,78,71,13,10,26,10].every((v,i)=>b[i]===v):kind==='jpg'&&b[0]===255&&b[1]===216&&b[2]===255;
}
function backupMime(kind){return kind==='pdf'?'application/pdf':kind==='png'?'image/png':'image/jpeg';}
function decodeBackupZIP(bytes){
 if(!(bytes instanceof Uint8Array)||bytes.length<22||bytes.length>BACKUP_MAX)throw Error('Invalid or oversized backup.');
 const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),end=bytes.length-22,u16=p=>v.getUint16(p,true),u32=p=>v.getUint32(p,true);
 if(u32(end)!==0x06054b50||u16(end+4)||u16(end+6)||u16(end+20))throw Error('Choose the original notebook ZIP, not a recompressed archive.');
 const count=u16(end+10),offset=u32(end+16);
 if(count<2||count>102||u16(end+8)!==count||offset+u32(end+12)!==end)throw Error('Invalid backup directory.');
 const entries=new Map(),decoder=new TextDecoder('utf-8',{fatal:true});let c=offset,local=0;
 for(let i=0;i<count;i++){
  if(c+46>end||u32(c)!==0x02014b50||u16(c+8)!==0x800||u16(c+10)||u16(c+30)||u16(c+32)||u16(c+34))throw Error('Unsupported backup entry.');
  const size=u32(c+24),len=u16(c+28),pos=u32(c+42);
  if(!len||c+46+len>end||size!==u32(c+20)||pos!==local||pos+30>offset||u32(pos)!==0x04034b50||u16(pos+6)!==0x800||u16(pos+8)||u32(pos+18)!==size||u32(pos+22)!==size||u16(pos+26)!==len||u16(pos+28))throw Error('Invalid backup entry.');
  const name=decoder.decode(bytes.subarray(c+46,c+46+len)),start=pos+30+len;
  if(start+size>offset||decoder.decode(bytes.subarray(pos+30,start))!==name||!/^(?:notebook\.json|manifest\.json|attachments\/[1-9]\d{0,2}\.(?:pdf|png|jpg))$/.test(name)||entries.has(name))throw Error('Unexpected backup entry.');
  const data=bytes.subarray(start,start+size);if(zipCRC(data)!==u32(c+16)||u32(pos+14)!==u32(c+16))throw Error('Backup checksum failed.');
  entries.set(name,data);local=start+size;c+=46+len;
 }
 if(c!==end||local!==offset||!entries.has('notebook.json')||!entries.has('manifest.json'))throw Error('Incomplete backup.');
 return entries;
}
function readBackupPackage(bytes){
 const entries=decodeBackupZIP(bytes),decoder=new TextDecoder('utf-8',{fatal:true});
 const read=name=>{const b=entries.get(name);if(!b||b.length>BACKUP_TEXT_MAX)throw Error('Invalid backup metadata.');return JSON.parse(decoder.decode(b));};
 const st=validateNotebook(read('notebook.json')),m=read('manifest.json'),expected=backupAttachments(st);
 if(m?.format!=='living-field-notebook-zip-v1'||!Array.isArray(m.attachments)||m.attachments.length!==expected.length||entries.size!==expected.length+2)throw Error('Attachment manifest does not match the notebook.');
 const records=[],paths=new Set();
 for(const ref of expected){const matches=m.attachments.filter(x=>x?.id===ref.id);if(matches.length!==1)throw Error('Missing or duplicate attachment manifest entry.');const a=matches[0],b=entries.get(a.path);
  if(a.kind!==ref.kind||typeof a.path!=='string'||!a.path.endsWith('.'+ref.kind)||!a.path.startsWith('attachments/')||paths.has(a.path)||!attachmentValid(ref.kind,b))throw Error('Invalid or missing attachment.');paths.add(a.path);records.push({...ref,bytes:b});
 }return {st,records};
}
function remapBackup(st,records,makeId){
 const ids=new Map(records.map(r=>[r.id,makeId(r)]));return {next:{...st,notes:st.notes.map(n=>({...n,pdfId:ids.get(n.pdfId)||n.pdfId||''})),figures:st.figures.map(f=>({...f,id:ids.get(f.id)||f.id})),pdfId:ids.get(st.pdfId)||st.pdfId||''},records:records.map(r=>({...r,id:ids.get(r.id)}))};
}
function deliverBackup(blob,name){const a=el('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function backup(){save();deliverBackup(new Blob([JSON.stringify(notebookSnapshot(state),null,2)],{type:'application/json'}),'guided-journey-backup.json');}
async function fullBackup(status){
 const snapshot=notebookSnapshot(state),refs=backupAttachments(snapshot),entries=[],manifest={format:'living-field-notebook-zip-v1',attachments:[]};let total=0;
 for(const [i,ref] of refs.entries()){
  status.textContent='Reading attachment '+(i+1)+' of '+refs.length+'…';const record=await pdfTransaction('readonly',store=>store.get(ref.id));
  if(!record?.blob)throw Error('Missing attachment: '+(ref.name||ref.kind)+'. Reattach it, or save a text-only backup.');
  total+=record.blob.size;if(total>BACKUP_MAX-2*BACKUP_TEXT_MAX)throw Error('Attachment collection is too large. Save text and retain your original files.');
  const b=new Uint8Array(await record.blob.arrayBuffer());if(!attachmentValid(ref.kind,b))throw Error('Unreadable attachment: '+(ref.name||ref.kind));
  const path='attachments/'+(i+1)+'.'+ref.kind;manifest.attachments.push({id:ref.id,kind:ref.kind,path});entries.push([path,b]);
 }
 const json=JSON.stringify(snapshot);if(utf8(json).length>BACKUP_TEXT_MAX)throw Error('Notebook text exceeds the complete-backup limit. Use text-only backup.');
 deliverBackup(new Blob([zipStore([['notebook.json',json],['manifest.json',JSON.stringify(manifest)],...entries])],{type:'application/zip'}),'living-field-notebook-complete.zip');
 status.textContent='Complete backup download requested: '+refs.length+' attachment(s). Keep it private and check your Downloads folder.';
}
let backupBusy=false;
async function restoreNotebook(file,status){
 if(!file||file.size>BACKUP_MAX)throw Error('Choose a notebook backup up to 200 MB.');
 const b=new Uint8Array(await file.arrayBuffer()),isZIP=b[0]===80&&b[1]===75;let st,records=[];
 if(isZIP){({st,records}=readBackupPackage(b));}else{if(b.length>BACKUP_TEXT_MAX)throw Error('Text backup is too large.');st=validateNotebook(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(b)));}
 const current=JSON.stringify(state),savedAtStart=localStorage.getItem(KEY);
 const note=isZIP?'This complete backup contains '+records.length+' attachment(s).':'This text-only backup does not contain PDF or image files. Existing links may work on the original device only.';
 if(!confirm(note+' Restore this notebook and replace the current notebook text? Cancel and back up your current work first if needed.')){status.textContent='Restore canceled. Current notebook unchanged.';return;}
 const staged=remapBackup(st,records,r=>(r.kind==='pdf'?'pdf-':'visual-')+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2))),written=[];
 try{
  for(const r of staged.records){status.textContent='Restoring attachment '+(written.length+1)+' of '+staged.records.length+'…';await pdfTransaction('readwrite',store=>store.put({id:r.id,name:r.name,bytes:r.bytes.slice().buffer,mime:backupMime(r.kind)}));written.push(r.id);}
  if(JSON.stringify(state)!==current||localStorage.getItem(KEY)!==savedAtStart)throw Error('Your notebook changed while restoring. Try again.');
  localStorage.setItem(KEY,JSON.stringify(staged.next));
 }catch(e){for(const id of written)await pdfTransaction('readwrite',store=>store.delete(id)).catch(()=>{});throw e;}
 pdfRequest++;state=staged.next;storageOK=true;render(true);notice(isZIP?'Notebook and attachments restored.':'Notebook text restored. Reattach original files if needed.');
}
function backupControls(root){
 const d=el('details');d.append(el('summary','Backup or restore my notebook'),el('p','Save a complete ZIP with writing, reading notes, PDFs and visuals, or a smaller text-only JSON. These files may contain copyrighted or personal material. Keep them private; do not submit or share the complete archive. Save a copy outside this browser.','hint'));
 const status=el('p','','hint');status.setAttribute('role','status');
 const full=btn('Download complete backup (.zip)',async()=>{if(backupBusy)return;backupBusy=true;full.disabled=true;try{await fullBackup(status);}catch(e){status.textContent=e.message||'Backup failed. Save a text backup.';}finally{backupBusy=false;full.disabled=false;}},'secondary');
 const label=el('label','Restore a notebook backup (.zip or .json)'),input=el('input');input.type='file';input.accept='.zip,.json,application/zip,application/json';input.id='notebook-restore';label.htmlFor=input.id;
 input.addEventListener('change',async()=>{const f=input.files?.[0];if(!f||backupBusy)return;backupBusy=true;input.disabled=true;try{await restoreNotebook(f,status);}catch(e){status.textContent=(e.message||'Restore failed.')+' Check your current notebook before continuing.';}finally{backupBusy=false;input.disabled=false;input.value='';}});
 d.append(full,btn('Download text-only backup (.json)',backup,'quiet'),label,input,status);root.append(d);
}


let controlSequence=0;
function uniqueControlId(prefix){return prefix+'-'+(++controlSequence);}
function pageFocus(title){if(!title)return;title.tabIndex=-1;title.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}
function addNotice(root){const message=el('p','','notice');message.id='notice';message.setAttribute('role','status');message.setAttribute('aria-atomic','true');message.tabIndex=-1;root.append(message);return message;}
function addSaveStatus(root){const n=el('p',storageOK?'Saved on this device':'Backup recommended','hint');n.id='save-state';n.setAttribute('role','status');root.append(n);}

function guidanceTerms(text){
 const stop=new Set('about above across after again also among another around because before being between both could does doing during each essay even every first from further have having here however into itself just like many might more most much must need only other over paragraph people perhaps really same should since some source still such than that their them then there these they thing things think this those through thus under until upon very want was were what when where which while will with within without would write your evidence article research thesis reading passage author suggests suggested says said study studies paper'.split(' '));
 return [...new Set((String(text||'').toLowerCase().match(/[\p{L}]{4,}/gu)||[]).filter(w=>!stop.has(w)).map(w=>/^synchronic(?:istic|ity|ities)$/.test(w)?'synchronicity':w.length>5?w.replace(/ies$/,'y').replace(/s$/,''):w))].slice(0,60);

function draftFocus(text,start,end){

 if(b>a&&t.slice(a,b).trim())return t.slice(a,b).trim().slice(0,2500);
 const left=t.lastIndexOf('\n\n',Math.max(0,a-1));const right=t.indexOf('\n\n',a);
 return t.slice(left<0?0:left+2,right<0?t.length:right).trim().slice(0,2500)||t.trim().slice(-2500);
}

}
function guidanceSnippet(focus,text){

function guidanceNotes(state,focus){

function guidanceCaution(text){
 const t=String(text||'');
 if(/\b(?:caus(?:e|es|ed|ing)|proves?|interven(?:e|es|ed|tion)|creates?|determines?|leads? to|results? in)\b/i.test(t))return 'If you are proposing a cause, what would distinguish that explanation from association or interpretation?';
 if(/\b(?:must|always|never|everyone|all people|only if|necessary)\b/i.test(t))return 'Check the scope of this claim. Could a counterexample or a different context complicate it?';

  if(!isCurrent())throw Error('Cancelled');

 for(let i=0;i<ordered.length;i++)for(let j=i+1;j<ordered.length;j++){
  const a=ordered[i],b=ordered[j];
  if(!distinctVoices(a,b))continue;
  const shared=guidanceTerms(a.excerpt).filter(w=>focusTerms.has(w)&&guidanceTerms(b.excerpt).includes(w));
  if(shared.length<2)continue;
  const normText=t=>String(t).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  if(normText(a.excerpt)===normText(b.excerpt)||normText(a.excerpt).includes(normText(b.excerpt))||normText(b.excerpt).includes(normText(a.excerpt)))continue;
  const score=a.score+b.score+shared.length*2;

function diachronicInquiry(st,before,after){

 const signals=[

 {id:'qualification',re:/\b(?:not always|not necessarily|only when|depends on|in some (?:cases|circumstances)|may not|cannot assume|could also|more complicated|limits? of)\b/i,prompt:'What condition, exception or limit did you discover? How does it make the earlier interpretation more precise?'},
 {id:'reciprocity',re:/\b(?:learn(?:ed|ing|s)? from (?:each other|one another|me too)|both (?:of us|people|generations) learn|mutual learning|two-way|reciprocal learning|learning goes both ways)\b/i,prompt:'How does the change from a one-directional relationship to a possible reciprocal one affect your interpretation? What evidence supports that reading?'},
 {id:'uncertainty',re:/\b(?:I (?:still )?(?:do not|don't|cannot|can't) know|remains uncertain|not sure|unanswered question|I wonder whether)\b/i,prompt:'What remains unresolved, and how did your inquiry help you recognize the limits of what you can claim?'},
 {id:'continuity',re:/\b(?:confirmed|reinforced|deepened|strengthened|still believe|still think|same position|more clearly)\b/i,prompt:'What specific evidence deepened or confirmed your understanding? What do you understand more clearly even if your position remains the same?'}
 ];
 const same=normalize(b)===normalize(a);

function departureTrajectory(profile,index,anchor){
 const b=profile[index],earlier=new Set(profile.slice(0,index).flatMap(x=>x.words)),a=new Set(anchor);

 const later=profile.slice(index+1).map(p=>({...p,reused:novel.filter(w=>p.words.includes(w))}));
 const strongest=later.filter(p=>p.reused.length>=2).sort((x,y)=>(y.shared.length>=1)-(x.shared.length>=1)||y.reused.length-x.reused.length||x.index-y.index)[0];

 if(link)return {kind:'return',label:'A possible productive departure',prompt:'This passage introduces wording that appears again alongside your central inquiry later: '+strongest.reused.slice(0,3).join(', ')+'. What new understanding does this return make possible? Keep or develop the departure if it changes the meaning of your inquiry.',later:bridgeExcerpt(strongest.text),terms:strongest.reused.slice(0,3)};

function reciprocityCue(st){
 const blocks=draftBlocks(st.essayDraft).filter(b=>!/^\[Figure [1-3]\]$/i.test(b.text));
 if(!blocks.length)return {kind:'early',label:'Begin by attending',question:'What have you actually experienced, heard or read? Let that encounter help shape the question.',excerpt:''};
 const interview=/\b(?:personal communication|interviewee|my (?:mother|father|grandmother|grandfather|aunt|uncle|neighbor|friend) (?:said|told|remembered|described))\b/i;
 const research=/\b(?:according to|McAnulty|(?:author|researcher|study|article|research) (?:argues?|shows?|finds?|suggests?|reports?))\b|\b(?:18|19|20)\d{2}[a-z]?\s*[,)]/i;
 const other=/\b(?:trees?|plants?|roots?|soil|rivers?|creeks?|animals?|dogs?|birds?|insects?|firefl(?:y|ies)|rocks?|wind|water|weather|fungi|mushrooms?)\b/i;
 const experience=/\b(?:I (?:saw|heard|noticed|felt|watched|remembered|stood|walked|observed|experienced)|my (?:childhood|memory|experience))\b/i;
 const change=/\b(?:I (?:had assumed|used to think|had believed|began to question|reconsidered|realized|came to understand|had not noticed)|challenged my|changed my|complicated my|I still wonder)\b/i;

 const cue=(kind,label,question,b)=>({kind,label,question,excerpt:b?bridgeExcerpt(b.text):''});
 const spoken=blocks.find(b=>interview.test(b.text));
 const nonhuman=blocks.find(b=>experience.test(b.text)&&other.test(b.text));
 const source=blocks.find(b=>research.test(b.text));
 const reflective=blocks.find(b=>change.test(b.text));
 if(spoken)return cue('interview','Listen before interpreting','What did this person offer on their own terms? Did their words deepen, complicate or sustain your understanding? Distinguish their account from your interpretation, respect permission and do not make one person speak for a whole community.',spoken);
 if(nonhuman)return cue('living','Attend to the living world','What did the animal, plant, water, soil or other material presence contribute to this encounter? Attend to its particular actions, conditions or relations, not just what it symbolizes for you. Distinguish direct observation, interpretation and what remains uncertain.',nonhuman);
 if(source)return cue('research','Think with another voice','What does this author or source allow you to notice that you might otherwise miss? Consider its context, limits and any difference from your own perspective. Agreement can deepen understanding too; do not invent a disagreement.',source);
 if(reflective)return cue('reflection','Trace what your encounter made possible','Your wording suggests reflection or reconsideration. What particular encounter helped you arrive there? Describe the relationship without claiming a transformation you did not experience.',reflective);
 const broad=blocks.find(b=>limit.test(b.text));
 if(broad)return cue('uncertainty','Make room for uncertainty','What can your own evidence reasonably establish, and what remains open? Consider a different experience or account without treating it as automatically more valid.',broad);

}

function citationNormalize(value){return String(value||'').normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[’']/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();}
function referenceIdentity(raw,year){

 const people=[...author.matchAll(/(?:^|,\s*&?\s*|\s+&\s+)([\p{L}][\p{L}’' .-]*?),\s*(?:[\p{Lu}]\.\s*){1,5}/gu)].map(m=>citationNormalize(m[1])).filter(Boolean);
 const group=citationNormalize(author.replace(/\s*\((?:Director|Producer|Ed\.|Eds\.)\)\s*$/i,''));
 return {people,group,year:String(year).toLowerCase().replace(/\s/g,'')};
}
function citationIdentity(author,year){
 const text=String(author||'').replace(/\*+/g,'').trim();
 const etal=/\bet al\.\s*$/i.test(text);

 const bracket=clean.match(/^(.+?)\s*\[([^\]]+)\]$/);
 return {group:citationNormalize(bracket?bracket[1]:clean),alias:bracket?citationNormalize(bracket[2]):'',people:clean.split(/\s+(?:and|&)\s+/i).map(citationNormalize),etal,year:String(year).toLowerCase().replace(/\s/g,'')};

function matchCitation(c,r,aliases){
 if(!c||!r||c.year!==r.year)return false;
 if(!r.people.length)return c.group===r.group||aliases[c.group]===r.group;
 if(c.etal)return r.people.length>=3&&c.people[0]===r.people[0];
 return c.people.length===r.people.length&&c.people.every((p,i)=>p===r.people[i]);
}
function citationAudit(essay,references){
 const text=String(essay||''), yearPattern='(?:1[5-9]\\d{2}|20\\d{2})[a-z]?|n\\.d\\.';

  const m=raw.match(new RegExp('^(.+?)\\s*\\(('+yearPattern+')(?:,[^)]*)?\\)\\s*\\.?','i'));
  return {raw,index,key:m?referenceIdentity(m[1],m[2]):null,personal:/personal communication/i.test(raw)};
 });
 const cites=[],aliases=Object.create(null);
 const add=(a,y,raw)=>{const key=citationIdentity(a,y);if(key.group){cites.push({key,raw,personal:false});if(key.alias)aliases[key.alias]=key.group;}};
 for(const m of text.matchAll(/\(([^()\n]{1,220})\)/g)){
  if(/personal communication/i.test(m[1])){cites.push({raw:m[0],personal:true});continue;}
  for(const part of m[1].split(';')){
   const p=part.trim().match(new RegExp('^(.+?),\\s*('+yearPattern+')(?=\\s*(?:,|$))','i'));
   if(p&&/\p{L}/u.test(p[1]))add(p[1],p[2],'('+part.trim()+')');
  }
  const n=m[1].match(new RegExp('^('+yearPattern+')(?=\\s*(?:,|$))','i'));
  if(n){
   const before=text.slice(Math.max(0,m.index-180),m.index).trimEnd();
   const known=refs.filter(r=>r.key&&!r.personal&&r.key.year===n[1].toLowerCase().replace(/\s/g,'')).flatMap(r=>r.key.people.length?[r.key.people.length===1?r.key.people[0]:r.key.people.length===2?r.key.people.join(' and '):r.key.people[0]+' et al']: [r.key.group]).sort((a,b)=>b.length-a.length);
   const norm=citationNormalize(before),hit=known.find(k=>norm===k||norm.endsWith(' '+k));
   if(hit){const a=hit.endsWith(' et al')?hit+'.':hit;add(a,n[1],a+' '+m[0]);}
   else{const a=before.match(/([\p{Lu}][\p{L}’'-]*(?:\s+(?:&|and)\s+[\p{Lu}][\p{L}’'-]*|\s+et al\.)?)\s*$/u);if(a)add(a[1],n[1],a[1]+' '+m[0]);}
  }
 }
 const regular=cites.filter(c=>!c.personal),issues=[];
 for(const c of regular){
  const matches=refs.filter(x=>!x.personal&&matchCitation(c.key,x.key,aliases));
  if(!matches.length)issues.push('Check citation against References: '+c.raw);
  else if(matches.length>1)issues.push('More than one possible reference match: '+c.raw);
 }
 for(const x of refs){
  if(x.personal)issues.push('Nonrecoverable course community interviews usually belong in the text, not References: '+x.raw.slice(0,120));
  else if(!x.key)issues.push('Check author/date structure: '+x.raw.slice(0,140));
  else if(!regular.some(c=>matchCitation(c.key,x.key,aliases)))issues.push('No recognizable matching in-text citation: '+x.raw.slice(0,140));
 }
 const sortable=refs.filter(x=>x.key&&!x.personal),sortKey=x=>x.key.people[0]||x.key.group;
 if(sortable.some((x,i)=>i>0&&sortKey(sortable[i-1]).localeCompare(sortKey(x),'en')>0))issues.push('Check alphabetical order by first author or organization.');
 const hasLocator=value=>/\bp{1,2}\.|\bpara\.|\bparagraph\b|\b\d{1,2}:\d{2}\b|\bsection\b/i.test(value);
 for(const m of text.matchAll(/[“"]([^”"\n]{3,})[”"]\s*\(([^()\n]{1,160})\)/g)){
  if(new RegExp(yearPattern,'i').test(m[2])&&!/personal communication/i.test(m[2])&&!hasLocator(m[2]))issues.push('Check locator for possible direct quotation: '+m[0].slice(0,140));
 }
 for(const m of text.matchAll(/([\p{Lu}][\p{L}’'-]*(?:\s+et al\.)?)\s*\(([^()\n]{1,60})\)[^.!?\n]{0,120}[“"]([^”"\n]{3,})[”"](?:\s*\(([^()\n]{1,100})\))?/gu)){
  if(new RegExp('^('+yearPattern+')$','i').test(m[2])&&!hasLocator(m[4]||''))issues.push('Check locator for possible narrative quotation: '+m[0].slice(0,140));
 }
 return {citations:regular.length,interviews:cites.filter(c=>c.personal).length,references:refs.length,issues:[...new Set(issues)].slice(0,30)};
}
function figureMarkers(text){

function figureIssues(st){

 const issues=[];

 if(f&&count!==1)issues.push('Figure '+n+': use exactly one [Figure '+n+'] marker on its own line.');
 if(!f&&count)issues.push('Figure '+n+': marker has no attached image.');
 if(f&&(!f.title?.trim()||!f.alt?.trim()))issues.push('Figure '+n+': add a title and image description.');

 if(i<0)return {label:'Find a meaningful place',question:'Where in the essay would this original visual help the reader notice something the prose alone cannot show?'};
 const prior=lines.slice(0,i).filter(l=>l.trim()&&!/^\s*\[Figure [1-3]\]\s*$/i.test(l)).slice(-1)[0]||'';
 const next=lines.slice(i+1).find(l=>l.trim()&&!/^\s*\[Figure [1-3]\]\s*$/i.test(l))||'';
 return {label:'Consider the visual’s role',question:'What does this image document, deepen or complicate in the surrounding writing? If it returns to an earlier place, what can the reader see differently now?',prior:prior.slice(-220),next:next.slice(0,220)};
}

}

async function imageDimensions(file){
 const url=URL.createObjectURL(file);try{return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('This image could not be read.'));img.src=url;});}finally{URL.revokeObjectURL(url);}
}
async function storeFigure(file,n){
 if(!file||!file.size||file.size>8*1024*1024)throw Error('Choose a PNG or JPEG up to 8 MB.');
 const b=new Uint8Array(await file.slice(0,8).arrayBuffer());
 const png=b.length===8&&[137,80,78,71,13,10,26,10].every((x,i)=>b[i]===x),jpg=b[0]===255&&b[1]===216&&b[2]===255;
 if(!png&&!jpg)throw Error('Choose an actual PNG or JPEG image.');
 const dim=await imageDimensions(file);if(!dim.width||!dim.height||dim.width*dim.height>40000000)throw Error('Image dimensions are too large. Resize a copy and try again.');
 const id='visual-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
 const bytes=await file.arrayBuffer();await pdfTransaction('readwrite',store=>store.put({id,name:file.name,bytes,mime:png?'image/png':'image/jpeg'}));
 return {id,number:n,name:file.name,ext:png?'png':'jpg',...dim};
}

function xmlText(value){return String(value??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'})[c]);}
function utf8(value){
 if(typeof TextEncoder!=='undefined')return new TextEncoder().encode(String(value));
 const out=[];for(const ch of String(value)){let cp=ch.codePointAt(0);if(cp<128)out.push(cp);else if(cp<2048)out.push(192|(cp>>6),128|(cp&63));else if(cp<65536)out.push(224|(cp>>12),128|((cp>>6)&63),128|(cp&63));else out.push(240|(cp>>18),128|((cp>>12)&63),128|((cp>>6)&63),128|(cp&63));}return Uint8Array.from(out);
}
function zipCRC(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;}

  const filename=utf8(name),bytes=typeof value==='string'?utf8(value):value,crc=zipCRC(bytes);
  const h=new Uint8Array(30+filename.length),v=new DataView(h.buffer);
  v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,filename.length,true);h.set(filename,30);
  const c=new Uint8Array(46+filename.length),cv=new DataView(c.buffer);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,33,true);cv.setUint32(16,crc,true);cv.setUint32(20,bytes.length,true);cv.setUint32(24,bytes.length,true);cv.setUint16(28,filename.length,true);cv.setUint32(42,offset,true);c.set(filename,46);
  local.push(h,bytes);central.push(c);offset+=h.length+bytes.length;centralSize+=c.length;
 }
 const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);
 const out=new Uint8Array(offset+centralSize+22);let p=0;for(const x of [...local,...central,end]){out.set(x,p);p+=x.length;}return out;
}
function wordRun(value,opts={}){
 const props=(opts.bold?'<w:b/>':'')+(opts.italic?'<w:i/>':'');
 return '<w:r>'+(props?'<w:rPr>'+props+'</w:rPr>':'')+String(value??'').split(/\r?\n/).map((line,i)=>(i?'<w:br/>':'')+'<w:t xml:space="preserve">'+xmlText(line)+'</w:t>').join('')+'</w:r>';
}
function wordP(value,opts={}){
 const spacing='<w:spacing w:before="'+(opts.before||0)+'" w:after="'+(opts.after||0)+'" w:line="480" w:lineRule="auto"/>';
 const ppr=(opts.keep?'<w:keepNext/>':'')+(opts.page?'<w:pageBreakBefore/>':'')+spacing+(opts.hanging?'<w:ind w:left="720" w:hanging="720"/>':opts.indent?'<w:ind w:firstLine="720"/>':'')+(opts.align?'<w:jc w:val="'+opts.align+'"/>':'');

}
function wordReference(line){const runs=String(line).split(/(\*[^*\n]+\*)/g).filter(Boolean).map(x=>x.startsWith('*')&&x.endsWith('*')&&x.length>2?wordRun(x.slice(1,-1),{italic:true}):wordRun(x)).join('');return wordP('',{hanging:true,runs});}
function wordFigure(f){

function wordEssay(text,figures){
 let result='',lines=[];
 const flush=()=>{if(lines.length){const value=lines.join('\n');result+=wordP(value,{indent:lines.length===1});lines=[];}};
 for(const line of String(text||'').replace(/\r\n/g,'\n').split('\n')){
  const marker=line.trim().match(/^\[Figure ([1-3])\]$/i);
  if(marker){flush();const f=figures.find(x=>x.number===Number(marker[1]));if(!f)throw Error('A figure marker has no image.');result+=wordFigure(f);}
  else if(!line.trim())flush();else lines.push(line);
 }flush();return result;
}

 const types=decl+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/></Types>';

async function exportWord(rootButton,status){
 const issues=figureIssues(state);

 if(!state.essayDraft?.trim()){status.textContent='Return to your essay draft and add your writing first.';return;}
 const snapshot=JSON.parse(JSON.stringify(state)),figs=snapshot.figures||[];
 const missing=['essayTitle','paperName','paperCourse','paperDate','paperAbstract','paperReferences','paperDisclosure'].filter(k=>!String(snapshot[k]||'').trim());
 const audit=citationAudit(snapshot.essayDraft,snapshot.paperReferences);
 if((missing.length||figs.length!==3||audit.issues.length||!audit.citations)&&!confirm('Some document details, figures or citation checks still need attention. Download an editable Word draft anyway? This is not a completed submission.'))return;
 rootButton.disabled=true;status.textContent='Preparing your Word document locally…';

  const images=[];
  for(const f of figs){const record=await pdfTransaction('readonly',store=>store.get(f.id));if(!record?.blob)throw Error('Figure '+f.number+' is missing on this device. Reattach the original image.');images.push({...f,bytes:new Uint8Array(await record.blob.arrayBuffer())});}
  const bytes=makeWordPackage(snapshot,images),a=el('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));a.download='my-living-world-essay.docx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Word file prepared. Open it and verify the layout, references, visual placement and assignment requirements before submitting.';
 }catch(e){status.textContent=e.message||'Word export failed. Your saved writing is unchanged.';}finally{rootButton.disabled=false;}
}

function courseProfile(input){
 const m=String(input||'').trim().toUpperCase().match(/^ENG\s*[- ]?\s*112\s*[- ]?\s*(\d{1,3})(FX|IN|SY)$/);

 const words=[...(state.words||[]),...String(state.search||'').split(/\s+AND\s+/i)].map(clean).filter(w=>usableSearch(w)&&inquiryTermsMatch(state.question,w));
 const title=clean(note?.title).replace(/[“”"‘’]/g,'');

 for(const a of words)for(const b of candidates){
  if(a.toLowerCase()===b.toLowerCase()||a.toLowerCase().includes(b.toLowerCase())||b.toLowerCase().includes(a.toLowerCase()))continue;

 if(db<3)issues.push('At least three selected notes must be recorded as PCC database sources.');
 if(entries.some(x=>!bibEntryReady(x)||bibCount(x.annotation)<150||bibCount(x.annotation)>200))issues.push('Verify sources, complete references and roles, and review the 150–200 word annotation ranges.');
 if(new Set(entries.map(x=>x.role).filter(x=>bibRoles().includes(x))).size<3)issues.push('Identify at least three different source roles.');

 if(bibCount(bibOverviewText(st))<200||bibCount(bibOverviewText(st))>300||!st.bibThesis?.trim()||!st.bibLens?.trim())issues.push('Review the 200–300 word overview, primary lens and working thesis.');

 file.addEventListener('change',async()=>{
  const selected=file.files[0];if(!selected)return;
  const token=++pdfRequest;
  if(!selected.size||selected.size>20*1024*1024){next.disabled=false;refreshLookup();fileStatus.textContent='Choose a nonempty PDF up to 20 MB, or enter citation details manually.';return;}

   state.pdfKeywords=found.keywords||[];renderKeywords();state.pdfImportStatus='PDF read. Check the citation details.';save();

   fileStatus.textContent=(retained?'PDF saved on this device. ':'PDF could not be stored; keep your original file. ')+'Scanned '+found.scannedPages+' page(s); readable text on '+found.textPages+'. '+(filled.length?'Filled '+filled.length+' empty citation field(s). Check these against the article before continuing. ':'No additional citation fields were filled. Check the existing details and enter anything missing. ')+(existing.length?'Your existing entries were kept. ':'')+(registry?'Citation details retrieved from Crossref. ':lookupFailed?'DOI lookup unavailable; you can retry below. ':!found.doi?'No DOI detected. You can also import a library RIS citation using the option below. ':'')+(found.hasText?'':'This PDF may be scanned or image-based. Automatic text reading is unavailable. ');
