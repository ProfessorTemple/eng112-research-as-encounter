const PDF_DB=KEY+'-pdf-shelf',PDF_STORE='files',PDF_MAX=20*1024*1024;
function pdfDB(){

  if(!window.indexedDB){reject(Error('Browser PDF storage unavailable'));return;}
  const req=indexedDB.open(PDF_DB,1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(PDF_STORE))req.result.createObjectStore(PDF_STORE,{keyPath:'id'});};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('PDF storage unavailable'));
  req.onblocked=()=>reject(Error('PDF storage is blocked by another tab'));

}
async function pdfTransaction(mode,action){
 const db=await pdfDB();

  let result,tx;
  try{tx=db.transaction(PDF_STORE,mode);const req=action(tx.objectStore(PDF_STORE));req.onsuccess=()=>{result=req.result;};}
  catch(e){db.close();reject(e);return;}
  tx.oncomplete=()=>{db.close();resolve(result);};
  tx.onabort=tx.onerror=()=>{db.close();reject(tx.error||Error('PDF storage failed'));};

}
async function retainPDF(file){

 const signature=new Uint8Array(await file.slice(0,5).arrayBuffer());
 if(String.fromCharCode(...signature)!=='%PDF-')throw Error('Not a PDF');
 const id=globalThis.crypto?.randomUUID?.()||'pdf-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 await pdfTransaction('readwrite',store=>store.put({id,name:file.name,blob:file}));

}

  if(tab&&!tab.closed)tab.location.href=url;
  else{const a=el('a','Open saved PDF');a.href=url;a.target='_blank';a.rel='noopener noreferrer';status.replaceChildren(a);}
