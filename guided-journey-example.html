function detectArticleDOI(lines=[],metadata=[],links=[]){

 for(let i=0;i<first.length;i++){
  const x=clean(first[i]);if(/^\s*(?:references|bibliography|works cited)\s*$/i.test(x))break;

   add(x,3);if(!/10\.\d{4,9}\//.test(x))add(first[i+1],3);
  }else if(/^\s*10\.\d{4,9}\//.test(x))add(x,2);

}
function extractArticleCitation(info={},lines=[],xmp={},links=[]){

function noDoiHeader(lines,height){

function firstPageCitation(items,height){

function scanCitationEvidence(pages){

  const a=ordered[i],b=ordered[j];
