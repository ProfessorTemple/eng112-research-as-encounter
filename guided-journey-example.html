function detectArticleDOI(lines=[],metadata=[],links=[]){

 for(let i=0;i<first.length;i++){
  const x=clean(first[i]);if(/^\s*(?:references|bibliography|works cited)\s*$/i.test(x))break;

   add(x,3);if(!/10\.\d{4,9}\//.test(x))add(first[i+1],3);

 for(const x of links)if(/doi\.org\//i.test(x))add(x,2);

}

 const title=firstUsable(xmp.title,info.Title),author=firstUsable(xmp.author,info.Author);

function noDoiHeader(lines,height){

function firstPageCitation(items,height){

function guidanceCaution(text){

 const lib=await pdfLibrary;lib.GlobalWorkerOptions.workerSrc=pdfBase+'pdf.worker.min.mjs';

  if(!isCurrent())throw Error('Cancelled');

  const page=await pdf.getPage(p),content=await page.getTextContent();let text='',line='';
  for(const item of content.items){if(typeof item.str!=='string')continue;line+=(line?' ':'')+item.str;if(item.hasEOL){if(/^(?:references|bibliography|works cited|literature cited|references and notes)\s*[:.]?$/i.test(line.trim())){stopped=true;break;}text+=line+' ';line='';}}

  page.cleanup();if(stopped)break;

  const a=ordered[i],b=ordered[j];
  if(!distinctVoices(a,b))continue;
  const shared=guidanceTerms(a.excerpt).filter(w=>focusTerms.has(w)&&guidanceTerms(b.excerpt).includes(w));
  if(shared.length<2)continue;
  const normText=t=>String(t).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  if(normText(a.excerpt)===normText(b.excerpt)||normText(a.excerpt).includes(normText(b.excerpt))||normText(b.excerpt).includes(normText(a.excerpt)))continue;

function revisionLayers(){return [
 {id:'discovery',title:'Discovery',question:'What has this essay discovered that you did not understand at the beginning?',hint:'Return to your central question and working thesis. Read for changes in your understanding rather than correcting sentences.'},
 {id:'structure',title:'Structure',question:'Does each section develop an idea and help the reader move toward your discovery?',hint:'Consider the order of your thematic sections, the bridges between them and the return to your central presence or question.'},
 {id:'braiding',title:'Braiding',question:'Where do different forms of evidence actually change how you understand one another?',hint:'Bring your own experience, interview voices, course readings, historical or other outside research into conversation. Not every paragraph needs a citation.'},
 {id:'voice',title:'Voice and expression',question:'Where is your own thinking most visible, and where could your voice become more specific?',hint:'Preserve your chosen creative or analytical voice. Attend to scene, sensory details, precise explanations, imagery or uncertainty where they genuinely serve your inquiry.'},
 {id:'completeness',title:'Completeness and documentation',question:'Have you prepared the complete assignment, not just the essay draft?',hint:'Check the actual document you will submit. The notebook cannot inspect its formatting, verify all citations or certify that you have met the requirements.'}
];}
function revisionRequirements(st=state){return [
 {id:'essay',label:'Main essay: approximately 1,200–1,500 words, one developing inquiry and a Living Three-Story Thesis.'},
 {id:'voices',label:'McAnulty, another relevant course voice, three outside sources selected from the annotated bibliography, and two community interviews.'+(courseFor(st).physical==='required'?' Include at least one relevant physical PCC Library book.':'')},
 {id:'visuals',label:'Three original visuals, purposefully embedded and clearly labeled.'},
 {id:'apa',label:'APA student-paper title page, required abstract, accurate in-text citations and References page; personal interviews cited as personal communication.'},
 {id:'finish',label:'AI Use Disclosure, all placeholders resolved, and final document proofread.'}
];}
function revisionNext(state){

function revisionChecks(state){

}

function intellectualTrail(st){
 const clean=x=>String(x||'').trim(),cmp=x=>clean(x).replace(/\s+/g,' ');
 const original=clean(st.firstEncounter),saved=clean(st.encounter),first=clean(st.initialThesis),working=clean(st.workingThesis),strengthened=clean(st.strengthenedThesis),current=clean(st.reconsideredThesis),reflection=clean(st.thesisReflection);
 const before=first||working,after=current||strengthened||working;
 const blocks=draftBlocks(st.essayDraft),last=blocks.at(-1)?.text||'';
 const earlierTerms=new Set(bridgeTerms(before)),laterTerms=bridgeTerms(after),added=before&&after?laterTerms.filter(t=>!earlierTerms.has(t)).slice(0,4):[];
 const oldTerms=bridgeTerms(before),laterSet=new Set(laterTerms),retained=before&&after?oldTerms.filter(t=>laterSet.has(t)).slice(0,4):[];
 const notes=Array.isArray(st.notes)?st.notes:[],connections=Array.isArray(st.connections)?st.connections:[],strands=Array.isArray(st.strands)?st.strands:[];
 const candidates=[];
 for(const c of connections){if(clean(c?.reflection)){const titles=[c.left,c.right].map(id=>notes.find(n=>n.id===id)?.title).filter(Boolean);candidates.push({title:titles.length?titles.join(' + '):'My source comparison',text:clean(c.reflection),kind:'My comparison reflection'});}}
 for(const n of notes){if(clean(n?.reflection))candidates.push({title:clean(n.title)||'My reading note',text:clean(n.reflection),kind:'My reading reflection'});}
 if(clean(st.alternativePlan))candidates.push({title:'My alternative interpretation',text:clean(st.alternativePlan),kind:'My inquiry plan'});
 if(clean(st.assumptionPlan))candidates.push({title:'An assumption I examined',text:clean(st.assumptionPlan),kind:'My inquiry plan'});
 for(const n of strands){if(n?.type==='interview'&&n.permission===true&&clean(n.passage))candidates.push({title:clean(n.title)||'Community interview',text:clean(n.passage),kind:'Approved interview material'});else if(['course','diary','lived','history'].includes(n?.type)&&clean(n.passage))candidates.push({title:clean(n.title)||'Saved material',text:clean(n.passage),kind:'Saved material'});}
 const target=new Set(bridgeTerms([after,reflection,last].join(' ')));
 const ranked=candidates.map((x,i)=>({...x,i,score:bridgeTerms(x.text).filter(t=>target.has(t)).length})).sort((a,b)=>b.score-a.score||a.i-b.i);
 const material=ranked[0]||null;
 const relation=!before||!after?'incomplete':cmp(before)===cmp(after)?'unchanged':'different';
 let question='What has your inquiry helped you understand, qualify or ask more precisely? You do not need to change your worldview to demonstrate discovery.';
 if(!before||!after)question='Record your working thesis and revisit it after drafting. What might your evidence help you understand more precisely?';
 else if(!first)question='Your earliest thesis is not separately recorded. Compare the saved working and later thesis without assuming that the first version is available.';
 else if(relation==='unchanged')question='Your thesis wording is unchanged. What evidence helped you retain it, what limits did you recognize, or what question remains? Deepening a position can be as meaningful as changing it.';

 return {encounter:original||saved,encounterLabel:original?(st.firstEncounterRecovered?'Earliest available saved encounter':'Opening freewrite saved before research'):'Saved freewrite (earliest version not separately retained)',before,beforeLabel:first?'First saved working thesis':'Working thesis (earliest version not separately retained)',after,afterLabel:current?'Reconsidered thesis':strengthened?'Strengthened working thesis':'Current working thesis',relation,added,retained,material,reflection,last,question};
}

function continuityTerms(text){return [...new Set(bridgeTerms(text).filter(t=>!['essay','source','research','study','writer','writing','reader','question','topic','point','example','article','author','information','important','because','however','therefore'].includes(t)))];}
function continuityScan(st){
 const clean=x=>String(x||'').trim(),question=clean(st.question),thesis=clean(st.reconsideredThesis||st.strengthenedThesis||st.workingThesis),lens=clean(st.criticalLens),blocks=draftBlocks(st.essayDraft).filter(b=>!/^\[Figure [1-3]\]$/i.test(b.text));
 const terms=continuityTerms([question,thesis].join(' ')),anchor=new Set(terms),overlap=(a,b)=>a.filter(t=>b.has(t)),profile=blocks.map((b,i)=>({index:i,text:b.text,words:continuityTerms(b.text),count:revisionWordCount(b.text)})).map(b=>({...b,shared:overlap(b.words,anchor)}));
 const long=profile.filter(b=>b.count>=30),first=profile[0],last=profile.at(-1);
 const base={question,thesis,lens,paragraphs:profile.length,anchored:profile.filter(b=>b.shared.length>=2).length,kind:'open',label:'Read for continuity',prompt:'What thread connects the essay’s different materials? A recurring image, idea, question or relationship may carry the reader without repeating the same words.',excerpt:'',context:''};
 const result=(kind,label,prompt,b,context='')=>({...base,kind,label,prompt,excerpt:b?bridgeExcerpt(b.text):'',context});
 if(profile.length<2||terms.length<2)return result('early','Let the inquiry develop','Keep writing before evaluating the continuity of the whole essay. Your inquiry can change as you discover more.',first);
 // A new closing thread matters only if it appears repeatedly earlier in the draft.
 if(last&&last.count>=25&&profile.length>=3){
  const earlier=new Set(profile.slice(0,-1).flatMap(b=>b.words)),newShared=last.words.filter(t=>!anchor.has(t)&&earlier.has(t));
  if(newShared.length>=2&&last.shared.length<2&&profile.slice(0,-1).some(b=>b.shared.length>=2))return result('emerging','An emerging direction','Your ending returns to wording outside your saved question and thesis: '+newShared.slice(0,3).join(', ')+'. Does this name a discovery worth developing? Consider revising the inquiry or strengthening the earlier passages rather than removing the new idea.',last);
 }
 // Flag only substantial interior passages with few links to the anchor and both neighbors.
 for(const b of long){
  if(b.index===0||b.index===profile.length-1||b.shared.length>=1)continue;
  const prev=profile[b.index-1],next=profile[b.index+1],neighbors=new Set([...prev.words,...next.words]);
  if(overlap(b.words,neighbors).length<=1&&prev.shared.length+next.shared.length>=2)return result('crossing','Check one change of direction','This passage shares little exact vocabulary with your saved inquiry or its neighbors. Does it introduce a necessary context, image or complication, or could a clearer bridge help the reader? Do not remove it simply because the words differ.',b,'Earlier passage: '+bridgeExcerpt(prev.text,true));
 }
 const lived=/\b(?:I (?:noticed|remembered|remember|saw|heard|watched|felt|observed|walked|stood|experienced)|my (?:childhood|memory|experience|grandmother|grandfather|family))\b/i;
 const citation=/\b(?:18|19|20)\d{2}[a-z]?\s*[,)]|\baccording to\b/i;
 const start=profile.find(b=>lived.test(b.text));
 if(start&&start.index<2&&profile.length>=5){
  const tail=profile.slice(start.index+1),livedTerms=new Set(continuityTerms(st.firstEncounter||st.encounter||start.text));
  if(tail.filter(b=>citation.test(b.text)).length>=2&&!tail.some(b=>lived.test(b.text)||overlap(b.words,livedTerms).length>=2))return result('experience','Return to the lived encounter','Your opening includes an identifiable lived moment, while later passages contain research cues without a clear recurring connection to that moment. Could a return to the scene, image or your interpretation make the relationship visible? An analytical return is equally valid.',tail.find(b=>citation.test(b.text)));
 }
 if(lens){const lt=continuityTerms(lens);if(lt.length>=2&&!profile.some(b=>overlap(b.words,new Set(lt)).length>=2))return result('lens','Revisit your critical lens','The wording of your saved critical lens is not clearly recurring in the draft. How does this perspective shape what you notice, question or interpret? The lens can operate without being named repeatedly.',first);}
 if(last&&last.shared.length<1&&first?.shared.length>=2&&profile.length>=3&&last.count>=25)return result('ending','Check the ending’s relationship','Does your ending extend the inquiry, reveal a changed understanding or open a new question? Explain the relationship if the reader needs it. A literal return is not required.',last);

function revisionCue(state,layer){
 const text=String(state.essayDraft||'').trim(), blocks=draftBlocks(text);
 const thesis=String(state.reconsideredThesis||state.strengthenedThesis||state.workingThesis||'');
 const cue=(label,question,excerpt='',context='')=>({label,question,excerpt:bridgeExcerpt(excerpt),context});
 if(!blocks.length)return cue('Begin with material','Write a little of your essay before asking the notebook to suggest a revision.');
 if(layer==='discovery'){
  if(blocks.length<2)return cue('Allow discovery to unfold','What might this passage lead you to investigate or reconsider as the essay develops?',blocks[0].text);
  const last=blocks[blocks.length-1], prior=blocks.slice(0,-1).map(b=>b.text).join(' ');
  const thesisTerms=new Set(bridgeTerms(thesis)), earlier=new Set(bridgeTerms(prior));
  const emerging=bridgeTerms(last.text).filter(w=>earlier.has(w)&&!thesisTerms.has(w)).slice(0,3);
  if(thesis&&emerging.length>=2)return cue('An emerging thread','Your ending and earlier writing share these words: '+emerging.join(', ')+'. Do they name a developing insight that your working thesis should reflect, or are they details that already belong to it?',last.text);
  const shared=bridgeOverlap(blocks[0].text,last.text);
  if(shared.length)return cue('Return with changed understanding','Your opening and ending both use '+shared.join(', ')+'. What has your inquiry helped you understand differently? You can keep the recurrence if it develops meaning.',last.text);
  return cue('Revisit your central question','Does this ending answer, complicate or reopen your original question? Compare it with the working thesis. A literal return to the opening is optional.',last.text);
 }
 if(layer==='structure'){
  const continuity=continuityScan(state);if(!['open','early'].includes(continuity.kind))return {label:continuity.label,question:continuity.prompt,excerpt:continuity.excerpt,context:continuity.context};
  if(blocks.length<2)return cue('Give the next idea room','As you develop another section, decide what idea will carry the reader forward. A short passage or poetic fragment can be intentional.',blocks[0].text);
  let index=1;
  for(let i=1;i<blocks.length;i++){if(!bridgeOverlap(blocks[i-1].text,blocks[i].text).length&&revisionWordCount(blocks[i].text)>=25){index=i;break;}}
  const a=blocks[index-1],b=blocks[index],common=bridgeOverlap(a.text,b.text);
  return cue('Examine one crossing',common.length?'Both passages use '+common.join(', ')+'. Does the second develop the first idea, introduce a new dimension or deliberately return to an image?':'These neighboring passages do not share much exact vocabulary. Is their relationship already clear through an image, contrast, question or analytical connection? Only revise if a reader needs more guidance.',b.text,'Previous passage: '+bridgeExcerpt(a.text,true));
 }
 if(layer==='braiding'){
  const attributed=/\b(?:according to|(?:author|researcher|study|article|research) (?:argues?|shows?|finds?|suggests?|reports?)|personal communication)\b|\b(?:18|19|20)\d{2}[a-z]?\s*[,)]/i;
  const interview=/\b(?:personal communication|interviewee|my (?:mother|father|grandmother|grandfather|aunt|uncle|neighbor|friend) (?:said|told|remembered|described))\b/i;
  const lived=/\b(?:I (?:saw|heard|noticed|felt|watched|remember|remembered|experienced|stood|walked|observed)|my (?:childhood|memory|experience|family))\b/i;
  const idx=blocks.findIndex(b=>interview.test(b.text));
  if(idx>=0)return cue('Listen to a community voice','What knowledge does this person bring, and how does it deepen or complicate your own experience or research? Keep their words, context and your interpretation distinct.',blocks[idx].text);
  const source=blocks.find(b=>attributed.test(b.text));
  if(source)return cue('Read beyond the citation','What does this source help you see that you could not see alone? Consider bringing an actual lived detail, community voice or contrasting source into this discussion if it serves the idea.',source.text);
  const scene=blocks.find(b=>lived.test(b.text));
  if(scene)return cue('Treat lived experience as evidence','What does this particular experience reveal, and what could another voice help you understand differently? You do not need a scholarly citation for the fact that you experienced something.',scene.text);
  return cue('Choose one meaningful connection','Find a place where your own observation, an interview, a course reading or outside research could change the meaning of another strand. Not every paragraph needs all strands.',blocks[0].text);
 }
 if(layer==='voice'){
  const sensory=/\b(?:heard|sound|smell|scent|touched|felt|texture|light|shadow|warm|cold|voice|color|colour|wind|rain|taste)\b/i;
  const scene=/\b(?:I (?:saw|noticed|remember|remembered|walked|stood|watched|felt|heard|experienced)|my (?:childhood|grandmother|grandfather|mother|father))\b/i;
  const b=blocks.find(x=>scene.test(x.text)&&!sensory.test(x.text));
  if(b)return cue('Return to a lived detail','If this moment matters to your inquiry, could a specific action, remembered detail or sensory observation help the reader experience it? A precise analytical explanation is also a valid choice. Do not invent details.',b.text);
  const expressive=blocks.find(x=>sensory.test(x.text));
  if(expressive)return cue('Notice your expressive choices','Which detail or image here carries meaning beyond description? Consider whether your own explanation, metaphor or a later echo would deepen it. Keep the style that feels right for your essay.',expressive.text);
  return cue('Make your interpretation visible','Where does this passage move beyond reporting information into your own thinking? Clarify what you make of the evidence without forcing first person, imagery or poetry.',blocks[0].text);
 }
 if(layer==='completeness'){
  const marker=text.match(/\[(?:[^\]\n]{0,100}\b(?:insert|verify|citation needed|check source|add citation|add source|figure|placeholder|todo)\b[^\]\n]{0,100})\]|\b(?:CITATION NEEDED|VERIFY PAGE|CHECK SOURCE|TODO)\b/i);
  if(marker)return cue('Resolve a drafting marker','Check whether this marker still needs a source, page number, visual or other material in your actual submission.',marker[0]);
  const count=revisionWordCount(text);
  if(count<1200||count>1500)return cue('Review the main-essay length','The editor contains about '+count+' words. The course guide expects approximately 1,200–1,500 words in the main essay. Check the actual submission document; develop or trim only where it serves the writing.');
  const remaining=revisionRequirements().find(x=>!state.revisionChecks?.[x.id]);
  return remaining?cue('Verify one requirement','Check this in your actual submission document: '+remaining.label):cue('Read the submission document once more','You have self-confirmed all five groups. Check the finished file, including formatting and actual visuals, before submitting it yourself.');
 }

}

 if(step<28){
  root.append(field('My essay draft','essayDraft',14));
  document.getElementById('input-essayDraft').addEventListener('blur',refreshCue);
  root.append(btn(step===27?'Save and check assignment completeness →':'Save this review and continue →',()=>{
   if(!state.essayDraft.trim()){notice('Keep an essay draft in the editor before continuing.');return;}
   state.revisionPasses=revisionPass(state,layer.id);save();go(step+1);
  }));
  layerContext(root,layer);
  const d=el('details');const original=el('p',state.revisionOriginal);original.style.whiteSpace='pre-wrap';d.append(el('summary','Compare with my draft before layered revision'),original);root.append(d);
  if(step===24)root.append(btn('Reconsider my working thesis again',()=>{state.revisionThesisReturn=true;go(21);},'quiet'));
  root.append(el('p','You may keep a passage unchanged when it already does what you intend. This review records your attention, not an automated grade.','hint'));
 }else{
  root.append(el('p','Draft word count: '+revisionWordCount(state.essayDraft)+' (approximate; main essay only).','hint'));
  const group=el('fieldset');group.append(el('legend','Check your submission document yourself'));
  const status=el('p','','hint');status.setAttribute('role','status');
  function refresh(){status.textContent=revisionChecks(state)+' of '+revisionRequirements().length+' groups confirmed by you.';}
  for(const x of revisionRequirements()){const l=el('label','','option'),c=el('input');c.type='checkbox';c.checked=state.revisionChecks?.[x.id]===true;
   c.addEventListener('change',()=>{state.revisionChecks={...(state.revisionChecks||{}),[x.id]:c.checked};state.revisionFinished=false;save();refresh();refreshCue();});l.append(c,el('span',x.label));group.append(l);}
  root.append(group,status);refresh();
  root.append(btn('Save my revision review →',()=>{state.revisionPasses=revisionPass(state,'completeness');state.revisionFinished=true;save();go(29);}));
  root.append(el('p','You can save your review with items still unchecked. Finish and verify those items in your submission document. This notebook does not submit anything to Moodle.','hint'),btn('Download essay text to prepare my document',downloadEssayOnly,'secondary'));
 }
}

function citationNormalize(value){return String(value||'').normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[’']/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();}
function referenceIdentity(raw,year){
 const author=String(raw||'').replace(/\*+/g,'').trim();
 const people=[...author.matchAll(/(?:^|,\s*&?\s*|\s+&\s+)([\p{L}][\p{L}’' .-]*?),\s*(?:[\p{Lu}]\.\s*){1,5}/gu)].map(m=>citationNormalize(m[1])).filter(Boolean);
 const group=citationNormalize(author.replace(/\s*\((?:Director|Producer|Ed\.|Eds\.)\)\s*$/i,''));
 return {people,group,year:String(year).toLowerCase().replace(/\s/g,'')};
}
function citationIdentity(author,year){
 const text=String(author||'').replace(/\*+/g,'').trim();
 const etal=/\bet al\.\s*$/i.test(text);
 const clean=text.replace(/\bet al\.\s*$/i,'').trim();
 const bracket=clean.match(/^(.+?)\s*\[([^\]]+)\]$/);

function matchCitation(c,r,aliases){

}
function citationAudit(essay,references){

  const m=raw.match(new RegExp('^(.+?)\\s*\\(('+yearPattern+')(?:,[^)]*)?\\)\\s*\\.?','i'));

  if(/personal communication/i.test(m[1])){cites.push({raw:m[0],personal:true});continue;}
  for(const part of m[1].split(';')){
   const p=part.trim().match(new RegExp('^(.+?),\\s*('+yearPattern+')(?=\\s*(?:,|$))','i'));
   if(p&&/\p{L}/u.test(p[1]))add(p[1],p[2],'('+part.trim()+')');
  }
  const n=m[1].match(new RegExp('^('+yearPattern+')(?=\\s*(?:,|$))','i'));
  if(n){
   const before=text.slice(Math.max(0,m.index-180),m.index).trimEnd();
   const known=refs.filter(r=>r.key&&!r.personal&&r.key.year===n[1].toLowerCase().replace(/\s/g,'')).flatMap(r=>r.key.people.length?[r.key.people.length===1?r.key.people[0]:r.key.people.length===2?r.key.people.join(' and '):r.key.people[0]+' et al']: [r.key.group]).sort((a,b)=>b.length-a.length);
   const norm=citationNormalize(before),hit=known.find(k=>norm===k||norm.endsWith(' '+k));
   if(hit){const a=hit.endsWith(' et al')?hit+'.':hit;add(a,n[1],a+' '+m[0]);}
   else{const a=before.match(/([\p{Lu}][\p{L}’'-]*(?:\s+(?:&|and)\s+[\p{Lu}][\p{L}’'-]*|\s+et al\.)?)\s*$/u);if(a)add(a[1],n[1],a[1]+' '+m[0]);}
  }
 }
 const regular=cites.filter(c=>!c.personal),issues=[];
 for(const c of regular){
  const matches=refs.filter(x=>!x.personal&&matchCitation(c.key,x.key,aliases));
  if(!matches.length)issues.push('Check citation against References: '+c.raw);
  else if(matches.length>1)issues.push('More than one possible reference match: '+c.raw);
 }
 for(const x of refs){
  if(x.personal)issues.push('Nonrecoverable course community interviews usually belong in the text, not References: '+x.raw.slice(0,120));
  else if(!x.key)issues.push('Check author/date structure: '+x.raw.slice(0,140));
  else if(!regular.some(c=>matchCitation(c.key,x.key,aliases)))issues.push('No recognizable matching in-text citation: '+x.raw.slice(0,140));
 }
 const sortable=refs.filter(x=>x.key&&!x.personal),sortKey=x=>x.key.people[0]||x.key.group;
 if(sortable.some((x,i)=>i>0&&sortKey(sortable[i-1]).localeCompare(sortKey(x),'en')>0))issues.push('Check alphabetical order by first author or organization.');
 const hasLocator=value=>/\bp{1,2}\.|\bpara\.|\bparagraph\b|\b\d{1,2}:\d{2}\b|\bsection\b/i.test(value);
 for(const m of text.matchAll(/[“"]([^”"\n]{3,})[”"]\s*\(([^()\n]{1,160})\)/g)){
  if(new RegExp(yearPattern,'i').test(m[2])&&!/personal communication/i.test(m[2])&&!hasLocator(m[2]))issues.push('Check locator for possible direct quotation: '+m[0].slice(0,140));
 }
 for(const m of text.matchAll(/([\p{Lu}][\p{L}’'-]*(?:\s+et al\.)?)\s*\(([^()\n]{1,60})\)[^.!?\n]{0,120}[“"]([^”"\n]{3,})[”"](?:\s*\(([^()\n]{1,100})\))?/gu)){
  if(new RegExp('^('+yearPattern+')$','i').test(m[2])&&!hasLocator(m[4]||''))issues.push('Check locator for possible narrative quotation: '+m[0].slice(0,140));
 }

}
function figureMarkers(text){

function figureIssues(st){

function wordEssay(text,figures){
 let result='',lines=[];
 const flush=()=>{if(lines.length){const value=lines.join('\n');result+=wordP(value,{indent:lines.length===1});lines=[];}};
 for(const line of String(text||'').replace(/\r\n/g,'\n').split('\n')){
  const marker=line.trim().match(/^\[Figure ([1-3])\]$/i);
  if(marker){flush();const f=figures.find(x=>x.number===Number(marker[1]));if(!f)throw Error('A figure marker has no image.');result+=wordFigure(f);}
  else if(!line.trim())flush();else lines.push(line);
 }flush();return result;
}

async function exportWord(rootButton,status){

 const snapshot=JSON.parse(JSON.stringify(state)),figs=snapshot.figures||[];
 const missing=['essayTitle','paperName','paperCourse','paperDate','paperAbstract','paperReferences','paperDisclosure'].filter(k=>!String(snapshot[k]||'').trim());
 const audit=citationAudit(snapshot.essayDraft,snapshot.paperReferences);
 if((missing.length||figs.length!==3||audit.issues.length||!audit.citations)&&!confirm('Some document details, figures or citation checks still need attention. Download an editable Word draft anyway? This is not a completed submission.'))return;

  const images=[];

 }catch(e){status.textContent=e.message||'Word export failed. Your saved writing is unchanged.';}finally{rootButton.disabled=false;}
}

function noteSurname(n){const a=String(n.author||'').trim();if(!a)return '';const first=a.split(/;| & | and /i)[0].trim();return (first.includes(',')?first.split(',')[0]:first.split(/\s+/).at(-1)).replace(/[^\p{L}’'-]/gu,'');}

 const matches=re?blocks.map((b,i)=>({b,i})).filter(({b})=>re.test(b.text)&&new RegExp('\\b'+escape(year)+'\\b','i').test(b.text)):[];
 return {n,name,matches};});
 const physical=named.filter(x=>x.n.sourceOrigin==='physical-book');
 const mc=blocks.find(b=>/\bMcAnulty\b/i.test(b.text));

}

   fileStatus.textContent=(retained?'PDF saved on this device. ':'PDF could not be stored; keep your original file. ')+'Scanned '+found.scannedPages+' page(s); readable text on '+found.textPages+'. '+(filled.length?'Filled '+filled.length+' empty citation field(s). Check these against the article before continuing. ':'No additional citation fields were filled. Check the existing details and enter anything missing. ')+(existing.length?'Your existing entries were kept. ':'')+(registry?'Citation details retrieved from Crossref. ':lookupFailed?'DOI lookup unavailable; you can retry below. ':!found.doi?'No DOI detected. You can also import a library RIS citation using the option below. ':'')+(found.hasText?'':'This PDF may be scanned or image-based. Automatic text reading is unavailable. ');
  }catch(error){if(token===pdfRequest&&file.isConnected){state.pdfImportStatus='PDF reading failed. Select the file again or paste its DOI below.';save();fileStatus.textContent=state.pdfImportStatus;}}
  finally{if(token===pdfRequest&&file.isConnected){next.disabled=false;refreshLookup();}}
 });
}
 const message=el('p','','notice');message.id='notice';message.setAttribute('role','status');app.append(message);
 const nav=el('nav','','nav');nav.setAttribute('aria-label','Notebook navigation');nav.append(btn('← Previous page',()=>{
 if(step===12){go(9);return;}
 if(step===21&&state.revisionThesisReturn){state.revisionThesisReturn=false;go(24);return;}
 if(step===24){go(22);return;}
 if(step>=25&&step<=33){go(step-1);return;}
 if(step===23){go(19);return;}
 if(step===20){go(23);return;}
 if(step>=13&&step<=22){go(step-1);return;}
 if(step===11){go(10);return;}
 if(step===10){go(9);return;}
 if(step===9){go(6);return;}
 if(step===8){go(state.notesReturn===8?6:state.notesReturn||6);return;}
 if(step===7){go(6);return;}
 if(step===6&&state.journalStage==='saved'){state.journalStage='passage';save();render(true);return;}
 if(step===6&&state.journalStage==='passage'){state.journalStage='details';save();render(true);return;}
 if(step===6&&state.articleReturnId){
  const hasDraft=['title','author','year','publication','doi','pdfName','location','passage','reflection'].some(k=>String(state[k]||'').trim());
  if(hasDraft&&!confirm('Discard this unfinished article and return to your saved reading note?'))return;
  const previous=returnToSavedArticle(state);if(previous){pdfRequest++;state=previous;go(6);return;}
 }
 go(step===6?5:step-1);
 },'quiet'),btn('Save backup',backup,'quiet'));
 if(step!==8&&state.notes?.length)nav.append(btn('My saved notes ('+state.notes.length+')',()=>{state.notesReturn=step;go(8);},'quiet'));if(writingResume(state)&&step<12)nav.append(btn('Return to my writing journey',returnToWriting,'quiet'));app.append(nav);if(focus){title.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}save();
}
