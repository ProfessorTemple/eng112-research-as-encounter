<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Living Field Notebook | Guided Journey example</title>
<style>
:root{color-scheme:light;--ink:#203e34;--muted:#526c60;--green:#245d4c;--line:#c5d3c8;--paper:#faf9f2;--soft:#eef3ea}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,sans-serif}header{background:#203f34;color:white;padding:1rem max(1rem,calc((100% - 640px)/2))}header small{display:block;letter-spacing:.08em;font-size:.72rem}header strong{font-size:1.12rem}main{max-width:650px;margin:0 auto;padding:1.15rem 1rem 2rem}h1{font-family:Georgia,serif;font-size:clamp(1.75rem,5vw,2.35rem);line-height:1.14;margin:.5rem 0 .9rem;font-weight:500}h2{font-size:1.12rem;margin:.9rem 0 .35rem}p{margin:.55rem 0 1rem}small,.hint{font-size:.88rem;color:var(--muted)}button,input,textarea,select,a.action{font:inherit}button,a.action{cursor:pointer;min-height:48px;border:1px solid var(--green);border-radius:9px;padding:.7rem .85rem;background:transparent;color:var(--green);font-weight:650;text-align:center;text-decoration:none}button.primary,a.primary{display:block;width:100%;background:var(--green);color:#fff;margin-top:1rem}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a26d28;outline-offset:3px}textarea,input[type=text]{display:block;width:100%;border:1px solid #9ab0a2;border-radius:8px;padding:.7rem;background:white;color:var(--ink);margin:.35rem 0 .8rem;font:inherit}textarea{resize:vertical}label{font-weight:600}fieldset{border:0;padding:0;margin:.75rem 0;min-width:0}legend{font-weight:650;margin-bottom:.4rem}.option{display:flex;align-items:flex-start;gap:.65rem;border:1px solid var(--line);border-radius:9px;padding:.7rem;margin:.45rem 0;background:#fff;font-weight:500;cursor:pointer}.option:has(input:checked){background:var(--soft);border-color:var(--green)}.option input{margin:.3rem 0 0;flex:none;width:20px;height:20px;accent-color:var(--green)}.option span{min-width:0}.option small{display:block;margin-top:.2rem}.progress{display:flex;gap:5px;margin:.4rem 0 1.1rem}.progress span{flex:1;height:5px;background:#dce5db;border-radius:6px}.progress .done{background:#398063}.progress .current{background:#245d4c}.topline{display:flex;justify-content:space-between;gap:.5rem;color:var(--muted);font-size:.85rem}.callout{background:var(--soft);border-left:3px solid #608976;padding:.75rem .9rem;margin:.8rem 0}.callout p{margin:.25rem 0}.query{font-weight:650;overflow-wrap:anywhere}.choice{display:block;width:100%;text-align:left;margin:.55rem 0;background:#fff}.choice small{display:block;font-weight:400}.secondary{display:inline-block;margin:.4rem 0}.quiet{border:0;padding:.4rem .15rem;min-height:44px;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}.nav{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:1.4rem;border-top:1px solid var(--line);padding-top:.65rem}.nav button{font-size:.88rem}.notice{font-size:.9rem;color:var(--muted);min-height:1.2em}.notice:empty{display:none}.screenreader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
</style></head><body><header><small>ENG 112 · WRITING THE LIVING WORLD</small><strong>My Living Field Notebook</strong></header><main id="app"></main>
<script>
'use strict';
const KEY='eng112-guided-journey-example-v1', SAMPLE="I remember getting caught in a traffic jam on the way to a holiday visit to my parents. I am always late, and it looked like I'd be late again. I didn't want to call and let them know to go ahead with the holiday dinner without me. I was waiting for a holiday miracle to happen.";
const blank=()=>({step:0,encounter:'',words:[],question:'',search:'',history:[],library:'copy',outcome:'',keywords:[],title:'',author:'',passage:'',location:'',reflection:'',pdfName:'',year:'',publication:'',doi:'',pdfKeywords:[],journalStage:'details'});
let state=blank(),storageOK=true;try{const saved=localStorage.getItem(KEY);if(saved)state={...blank(),...JSON.parse(saved)};}catch(e){storageOK=false;}
const app=document.getElementById('app');
const el=(tag,txt='',cls='')=>{const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n;};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}const n=document.getElementById('save-state');if(n)n.textContent=storageOK?'Saved on this device':'Backup recommended';}
function backup(){save();const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({prototype:'guided-journey-v1',...state},null,2)],{type:'application/json'}));a.download='guided-journey-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function btn(label,fn,cls='primary'){const b=el('button',label,cls);b.type='button';b.addEventListener('click',fn);return b;}
function go(step){state.step=step;save();render(true);}
function field(label,key,rows=0,placeholder=''){const wrap=el('div'),id='input-'+key,l=el('label',label),x=el(rows?'textarea':'input');l.htmlFor=id;x.id=id;if(rows)x.rows=rows;else x.type='text';x.placeholder=placeholder;x.value=state[key]||'';x.addEventListener('input',()=>{state[key]=x.value;save();});wrap.append(l,x);return wrap;}
function notice(text){const n=document.getElementById('notice');if(n)n.textContent=text;}
function norm(s){return String(s||'').trim().toLowerCase();}
function wordOptions(text){const out=[];const patterns=[/\bholiday miracle\b/i,/\btraffic jam\b/i,/\bholiday dinner\b/i,/\bparents\b/i,/\b(?:being )?late\b/i,/\bwaiting\b/i,/\bfireflies\b/i,/\bgrandmother\b/i,/\btrees\b/i,/\bmemory\b/i];for(const p of patterns){const m=text.match(p);if(m)out.push(m[0]);}const stop=new Set('i me my the and to a an of was were it in on with for that is be have had do did not but they them we you your as at so from can would could when what how why about again go looked remember getting always like'.split(' '));for(const w of text.match(/[\p{L}][\p{L}-]*/gu)||[]){if(w.length>3&&!stop.has(norm(w))&&!out.some(x=>norm(x).split(' ').includes(norm(w))))out.push(w);}return [...new Set([...state.words,...out].map(norm))].slice(0,10);}
function directions(text){const q=norm(text);if(/\bmiracles?\b/.test(q))return [
 {q:'hope AND uncertainty',d:'How people sustain hope when outcomes are uncertain.'},
 {q:'miracles AND religious experience',d:'How people understand an event as miraculous.'},
 {q:'coincidence AND meaning making',d:'How people give meaning to unexpected events.'},
 {q:'perceived control AND stress',d:'How people respond when they cannot control an outcome.'}];
 if(/\bfireflies\b/.test(q))return [{q:'fireflies AND flashing behavior',d:'When and how fireflies flash.'},{q:'fireflies AND communication',d:'How flashing works as a signal.'},{q:'fireflies AND light pollution',d:'Whether artificial light changes behavior.'}];
 if(/\b(?:memory|grandmother|parents|family)\b/.test(q))return [{q:'family stories AND memory',d:'How stories shape remembered experience.'},{q:'intergenerational knowledge AND oral history',d:'How knowledge moves between generations.'}];
 const words=state.words.slice(0,2);return words.length?[{q:words.join(' AND '),d:'Start with your own words; revise them as you discover academic language.'}]:[];}
function choices(text,exclude=false){const prior=new Set([...state.history,state.search].map(norm));const all=[...directions(text)];const anchor=state.search.split(/\s+AND\s+/i)[0]||state.words[0];for(const w of state.keywords)if(anchor&&norm(anchor)!==norm(w))all.unshift({q:anchor+' AND '+w,d:'Combine an earlier topic with a word you found.'});const seen=new Set();return all.filter(x=>{const k=norm(x.q);if(seen.has(k)||exclude&&prior.has(k))return false;seen.add(k);return true;}).slice(0,3);}
function makeSearch(q){if(!q.trim()){notice('Enter at least one search word.');return;}if(state.search&&!state.history.includes(state.search))state.history.push(state.search);state.search=q.trim();state.library='copy';state.outcome='';go(4);}
function showOptions(root,list){if(!list.length){root.append(el('p','No new modeled combination is available. Try your own search below.','hint'));}let picked=list[0]?.q||'';const group=el('fieldset'),legend=el('legend','Choose a research direction');group.append(legend);for(const item of list){const l=el('label','','option'),r=el('input');r.type='radio';r.name='direction';r.value=item.q;r.checked=item.q===picked;r.addEventListener('change',()=>{picked=item.q;custom.value=picked;});const body=el('span',item.q);body.append(el('small',item.d));l.append(r,body);group.append(l);}if(list.length)root.append(group);const label=el('label','Search words (you can edit these)');label.htmlFor='query';const custom=el('input');custom.type='text';custom.id='query';custom.value=picked;root.append(label,custom,btn('Use this search →',()=>makeSearch(custom.value)));}
let pdfRequest=0;
const pdfBase='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.624/legacy/build/';
let pdfLibrary;
function extractArticleCitation(info={},lines=[],xmp={}){
 const clean=v=>String(Array.isArray(v)?v.join('; '):v||'').replace(/\s+/g,' ').trim();
 const usable=v=>v.length>2&&v.length<600&&!/^(?:untitled|unknown|anonymous|none|microsoft word|ebsco(?:host)?|pdf|full text|article|administrator|user|dell|adobe acrobat)(?:\b|$)/i.test(v)&&!/\.pdf$/i.test(v);
 const patterns={title:'(?:article title|title)',author:'(?:author\\(s\\)|authors?|by)',publication:'(?:source|journal(?: title)?|publication(?: title)?|periodical)',date:'(?:publication date|published|date|year)',keywords:'(?:(?:author[- ]supplied|author|subject)\\s+)?(?:key\\s*words?|keywords?|subject terms)',doi:'(?:doi|digital object identifier)',stable:'(?:stable url|permalink|persistent link)'};
 const labelRe=new RegExp('^(?:'+Object.values(patterns).join('|')+'|abstract|document type|publisher|issn|isbn|accessed|database|volume|issue|pages|language)\\s*(?::|$)','i');
 const readLabel=(name)=>{const re=new RegExp('^'+patterns[name]+'\\s*(?::\\s*(.*)|$)','i');const i=lines.findIndex(line=>re.test(line));if(i<0)return '';const m=lines[i].match(re);if(m[1]?.trim())return clean(m[1]);const next=clean(lines[i+1]);return labelRe.test(next)?'':next;};
 const title=clean(xmp.title||info.Title),author=clean(xmp.author||info.Author);
 const t=readLabel('title'),a=readLabel('author'),pub=readLabel('publication'),date=readLabel('date');
 const publication=pub.replace(/,\s*(?:vol(?:ume)?\.?\s*\d|no\.?\s*\d|issue\s+\d|pp?\.?\s*\d|\(?\d{4}\b).*$/i,'').trim();
 const year=(date.match(/\b(?:19|20)\d{2}\b/)||pub.match(/\b(?:19|20)\d{2}\b/)||[])[0]||'';
 // Only use a DOI in a labeled field or early citation text, not the references.
 const early=lines.slice(0,45).join(' '),rawDoi=readLabel('doi')||early;
 const doi=(rawDoi.match(/(?:doi\s*:\s*|https?:\/\/(?:dx\.)?doi\.org\/)(10\.\d{4,9}\/[-._;()/:A-Z0-9]+)/i)||rawDoi.match(/^(10\.\d{4,9}\/[-._;()/:A-Z0-9]+)$/i)||[])[1]||'';
 const stable=readLabel('stable'),stableUrl=/^https?:\/\/(?:www\.)?jstor\.org\/stable\/[^\s]+$/i.test(stable)?stable.replace(/[.,;]+$/,''):'';
 const k=readLabel('keywords');
 const keywords=k?k.split(/[;,•]/).map(clean).filter(x=>x.length>1&&x.length<100&&!/^(abstract|keywords)$/i.test(x)).slice(0,15):[];
 return {title:usable(t)?t:usable(title)?title:'',author:usable(a)?a:usable(author)?author:'',publication:usable(publication)?publication:'',year,doi:doi?'https://doi.org/'+doi.replace(/[.,;]+$/,''):stableUrl,keywords,hasText:lines.join('').length>20};
}
async function readArticlePDF(file){
 // PDF bytes are passed to the reader in this browser, not to a citation or AI service.
 if(!pdfLibrary){pdfLibrary=import(pdfBase+'pdf.min.mjs').catch(e=>{pdfLibrary=null;throw e;});}
 const lib=await pdfLibrary;lib.GlobalWorkerOptions.workerSrc=pdfBase+'pdf.worker.min.mjs';
 const task=lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,enableXfa:false});
 try{
  const pdf=await task.promise,meta=await pdf.getMetadata().catch(()=>({})),lines=[];
  for(let p=1;p<=Math.min(3,pdf.numPages);p++){
   const page=await pdf.getPage(p),content=await page.getTextContent();
   let line='',lastY=null;
   for(const item of content.items){if(typeof item.str!=='string')continue;const y=item.transform?.[5];if(line&&lastY!==null&&typeof y==='number'&&Math.abs(y-lastY)>3){lines.push(line.trim());line='';}line+=(line?' ':'')+item.str;if(item.hasEOL){lines.push(line.trim());line='';}lastY=typeof y==='number'?y:null;}
   if(line.trim())lines.push(line.trim());
  }
  const xmp={title:meta.metadata?.get('dc:title'),author:meta.metadata?.get('dc:creator')};
  return extractArticleCitation(meta.info||{},lines.filter(Boolean),xmp);
 }finally{await task.destroy().catch(()=>{});}
}
function render(focus=false){app.replaceChildren();const step=state.step;
 if(step===0){app.append(el('p','GUIDED JOURNEY · WORKING EXAMPLE','hint'),el('h1','Start here'),el('p','Begin with something you experienced. Follow one small step at a time.'));app.append(btn(state.encounter?'Continue my example →':'Try the holiday miracle example →',()=>{if(!state.encounter)state.encounter=SAMPLE;go(1);}),btn('Start with my own experience',()=>{if(state.encounter&&!confirm('Replace this separate example?'))return;state=blank();go(1);},'secondary'));return;}
 const top=el('div','','topline');top.append(el('span',step<=5?'Research journey · '+step+' of 5':'Reading Journal'),el('span',storageOK?'Saved on this device':'Backup recommended'));top.lastChild.id='save-state';const progress=el('div','','progress');progress.setAttribute('aria-label','Research journey progress');for(let i=1;i<=5;i++)progress.append(el('span','',i<step?'done':i===step?'current':''));app.append(top,progress);
 const title=el('h1',({1:'My freewrite',2:'Discover my words',3:'Connect my ideas',4:'Search the library',5:'What did you discover?',6:'My Reading Journal'})[step]);title.tabIndex=-1;app.append(title);
 const body=el('section');app.append(body);
 if(step===1){body.append(el('p','Describe an experience that stays with you.'),field('My experience','encounter',7),btn('Discover my words →',()=>{if(!state.encounter.trim()){notice('Write a little about your experience first.');return;}go(2);}));}
 if(step===2){body.append(el('p','Choose two or three phrases that make you curious.'));const group=el('fieldset');group.append(el('legend','Words from your writing','screenreader'));const cue=el('div','','callout');function refresh(){const w=state.words.map(norm);cue.hidden=w.length<2;cue.textContent=w.some(x=>x.includes('miracle'))&&w.some(x=>/waiting|late|traffic/.test(x))?'Possible connection: waiting for something beyond your control can open questions about hope and uncertainty.':w.length>=2?'What relationship do you notice between '+w[0]+' and '+w[1]+'?':'';}for(const w of wordOptions(state.encounter)){const l=el('label','','option'),r=el('input');r.type='checkbox';r.checked=state.words.includes(w);r.addEventListener('change',()=>{state.words=r.checked?[...state.words,w]:state.words.filter(x=>x!==w);save();refresh();});l.append(r,el('span',w));group.append(l);}refresh();body.append(group,cue,btn('Connect my ideas →',()=>{if(!state.words.length){notice('Choose at least one word.');return;}go(3);}));}
 if(step===3){body.append(el('p','Turn your curiosity into a question.'));if(state.words.length)body.append(el('p','Your words: '+state.words.join(' · '),'hint'));if(!state.question&&state.words.some(x=>/miracle/i.test(x)))body.append(el('div','Example question: How do people understand unexpected events in difficult situations?','callout'));body.append(field('My research question','question',3,'What do I want to understand?'));const suggestion=el('div');suggestion.hidden=!state.question.trim();body.append(suggestion);const update=()=>{suggestion.replaceChildren();suggestion.hidden=!state.question.trim();if(!suggestion.hidden){suggestion.append(el('h2','Find academic language'),el('p','Search with short concepts rather than your whole question.','hint'));showOptions(suggestion,choices(state.question));}};const find=btn('Find research directions →',()=>{if(!state.question.trim()){notice('Write a question first.');return;}update();find.hidden=true;suggestion.scrollIntoView({block:'nearest'});});body.append(find);document.getElementById('input-question').addEventListener('input',()=>{suggestion.hidden=true;find.hidden=false;});if(state.question.trim()){update();find.hidden=true;}}
 if(step===4){body.append(el('div',state.search,'callout query'));if(state.library==='copy'){body.append(el('p','Copy these keywords to search in the library.'),btn('Copy search and continue →',async()=>{try{await navigator.clipboard.writeText(state.search);state.library='open';save();render(true);}catch(e){notice('Automatic copying is unavailable. Select the search words and copy them manually.');document.getElementById('manual-copy').hidden=false;}}));const manual=btn('I copied it myself →',()=>{state.library='open';save();render(true);},'secondary');manual.id='manual-copy';manual.hidden=true;body.append(manual);}else if(state.library==='open'){body.append(el('p','Search copied. Paste it into Academic Search Complete.'));const link=el('a','Open Academic Search Complete ↗','action primary');link.href='https://libguides.pittcc.edu/asc';link.target='_blank';link.rel='noopener noreferrer';link.addEventListener('click',()=>{state.library='away';save();setTimeout(()=>render(false),0);});body.append(link,el('p','Read a title and abstract (short summary). Return to this tab after searching.','hint'));}else{body.append(el('p','When you return from the library, tell the notebook what happened.'),btn('I’m back from the library →',()=>go(5)));}if(state.library!=='away')body.append(btn('Already searched? Continue',()=>go(5),'quiet'));}
 if(step===5){if(!state.outcome){body.append(el('p','Choose what happened.'));for(const [id,label,desc] of [['article','I found an article','Bring a useful source into my notebook.'],['words','I found new keywords','Learn the words and search again.'],['retry','My search did not work','Try a more meaningful combination.'],['question','My question is changing','Reconsider what I want to understand.']]){const b=btn(label,()=>{state.outcome=id;save();render(true);},'choice');b.append(el('small',desc));body.append(b);}}else if(state.outcome==='article'){body.append(el('p','Choose your downloaded article. The notebook will try to fill in its citation details.'),btn('Add my article →',()=>go(6)));}else if(state.outcome==='words'){body.append(el('p','Paste keywords from a title or abstract. Separate them with semicolons or new lines.'));const t=el('textarea');t.rows=3;t.setAttribute('aria-label','New keywords');t.value=state.keywords.join('; ');body.append(t,btn('Find new combinations →',()=>{state.keywords=[...new Set(t.value.split(/[;\n]+/).map(x=>x.trim()).filter(x=>x&&!/^(abstract|author[- ]supplied keywords|keywords)$/i.test(x)))].slice(0,20);state.outcome='retry';save();render(true);}));}else if(state.outcome==='retry'){body.append(el('p','Your earlier search is kept. Choose a different direction.'));showOptions(body,choices(state.question,true));if(state.keywords.length){const defs={'anthropogenic effects':'Effects caused by human activities.','communication disruption':'Interference with signals.','intraspecific interaction':'Interaction within a species.','interspecific interaction':'Interaction between species.','light pollution':'Artificial light that alters nighttime conditions.'};body.append(el('h2','Words you discovered'));for(const w of state.keywords)body.append(el('p',w+(defs[norm(w)]?': '+defs[norm(w)]:' · Check its meaning in your source.'),'hint'));}}else{body.append(field('My revised question','question',3),btn('Explore my revised question →',()=>go(3)));}if(state.outcome)body.append(btn('Choose a different outcome',()=>{state.outcome='';save();render(true);},'quiet'));}
 if(step===6){
 body.append(el('p','Choose the PDF you downloaded from the library. The notebook will look for the title, authors, publication, year, link, and keywords. Check what it finds.'));
 const label=el('label','Choose my article PDF (or enter details below)');label.htmlFor='pdf';
 const file=el('input');file.id='pdf';file.type='file';file.accept='.pdf,application/pdf';
 const fileStatus=el('p',state.pdfName?'Previously selected: '+state.pdfName:'Your PDF is read in this browser. Keep your original file.','hint');fileStatus.id='pdf-status';fileStatus.setAttribute('role','status');
 body.append(label,file,fileStatus,el('h2','1. Check my source details'),field('Article title','title'),field('Author(s)','author'),field('Publication year','year'),field('Journal or publication','publication'),field('DOI or article link','doi'));
 const wordsBox=el('div');wordsBox.id='pdf-keywords';body.append(wordsBox);
 function renderKeywords(){wordsBox.replaceChildren();if(!state.pdfKeywords?.length)return;wordsBox.append(el('p','Keywords printed in the article: '+state.pdfKeywords.join(' · '),'hint'));}
 renderKeywords();
 const next=btn('Confirm details and choose a passage →',()=>{if(!state.title.trim()||!state.author.trim()){notice('Enter or check the title and author first.');return;}state.journalStage='passage';save();render(true);});
 body.append(next);
 const passage=el('section');passage.hidden=state.journalStage!=='passage';passage.append(el('h2','2. Notice a meaningful passage'),el('p','Read your article. Choose a passage that matters to your question.'),field('Page or section','location'),field('One meaningful passage','passage',3),field('What does it help you understand?','reflection',3),btn('Save my reading note',()=>{if(!state.passage.trim()||!state.reflection.trim()){notice('Add a passage and your own reflection first.');return;}save();notice('Reading note saved in this example.');}));body.append(passage);
 if(state.journalStage==='passage'){for(const n of [...body.children])if(n!==passage)n.hidden=true;body.append(btn('Review my source details',()=>{state.journalStage='details';save();render(true);},'quiet'));}
 file.addEventListener('change',async()=>{
  const selected=file.files[0];if(!selected)return;
  const token=++pdfRequest;
  if(!selected.size||selected.size>20*1024*1024){next.disabled=false;fileStatus.textContent='Choose a nonempty PDF up to 20 MB, or enter citation details manually.';return;}
  if(state.pdfName&&state.pdfName!==selected.name&&['title','author','year','publication','doi','passage','location','reflection'].some(k=>String(state[k]||'').trim())){next.disabled=false;file.value='';fileStatus.textContent='This example holds one article at a time. Your existing citation and reading note are unchanged. Save a backup before starting a different example.';return;}
  state.pdfName=selected.name;save();
  fileStatus.textContent='Reading citation details from your PDF…';next.disabled=true;
  try{
   const found=await readArticlePDF(selected);
   if(token!==pdfRequest||state.step!==6||!file.isConnected)return;
   const conflict=['title','author','doi'].some(k=>found[k]&&String(state[k]||'').trim()&&norm(state[k])!==norm(found[k]));
   if(conflict){fileStatus.textContent='The PDF details differ from your existing citation. Nothing was changed. Compare the article with the fields below and edit them yourself.';return;}
   const filled=[],existing=[];
   for(const key of ['title','author','year','publication','doi']){
    if(!found[key])continue;
    const input=document.getElementById('input-'+key);
    if(!String(state[key]||'').trim()){state[key]=found[key];if(input)input.value=found[key];filled.push(key);}
    else if(norm(state[key])!==norm(found[key]))existing.push(key);
   }
   state.pdfKeywords=found.keywords||[];renderKeywords();save();
   fileStatus.textContent=(filled.length?'Filled '+filled.length+' empty citation field(s). Check these against the article before continuing. ':'No additional citation fields were filled. Check the existing details and enter anything missing. ')+(existing.length?'Your existing entries were kept. ':'')+(found.hasText?'':'This PDF may be scanned or image-based. Automatic text reading is unavailable. ');
  }catch(error){if(token===pdfRequest&&file.isConnected)fileStatus.textContent='Automatic PDF reading was unavailable. Your original PDF is unchanged; enter its citation details below.';}
  finally{if(token===pdfRequest&&file.isConnected)next.disabled=false;}
 });
}
 const message=el('p','','notice');message.id='notice';message.setAttribute('role','status');app.append(message);
 const nav=el('nav','','nav');nav.setAttribute('aria-label','Notebook navigation');nav.append(btn('← Previous page',()=>go(step===6?5:step-1),'quiet'),btn('Save backup',backup,'quiet'));app.append(nav);if(focus){title.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}save();
}
render();
</script></body></html>
